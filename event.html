<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17150f">
<meta name="robots" content="noindex">
<title>活动报名 · 义乌AI圈</title>
<link rel="icon" type="image/png" href="/assets/img/logo-icon.png?v=2">
<link rel="stylesheet" href="/assets/css/event.css?v=2">
</head>
<body>
<main class="ev" data-ev data-state="loading">
  <div class="ev__bg" aria-hidden="true" data-bg></div>


  <p class="ev__preview" data-preview hidden>预览模式：活动尚未发布，访客看不到这个页面</p>

  <div class="ev__stage">
    <button class="ev__music" type="button" data-music aria-pressed="false" aria-label="背景音乐" hidden>
      <svg class="ev__music-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
      <svg class="ev__music-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle><path d="M3 3l18 18"></path></svg>
    </button>
    <div class="ev__card" data-card>

      <section class="ev__face ev__front" data-front aria-label="活动海报">
        <img class="ev__poster" data-poster alt="" hidden>
        <div class="ev__cover" data-cover>
          <img class="ev__cover-logo" src="/assets/img/logo-light.png?v=2" alt="义乌AI圈">
          <h2 class="ev__cover-title" data-cover-title>活动报名</h2>
          <p class="ev__cover-sub" data-cover-sub></p>
          <p class="ev__cover-meta" data-cover-meta></p>
        </div>
        <div class="ev__front-bar">
          <button class="ev__cta" type="button" data-flip disabled>
            <span data-cta-label>加载中…</span>
          </button>
        </div>
      </section>

      <section class="ev__face ev__back" data-back aria-labelledby="evTitle" inert>
        <div class="ev__back-inner">
          <button class="ev__unflip" type="button" data-unflip>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
            看海报
          </button>

          <h1 class="ev__title" id="evTitle" tabindex="-1" data-title>活动报名</h1>
          <ul class="ev__meta" data-meta></ul>
          <dl class="ev__orgs" data-orgs hidden></dl>
          <p class="ev__intro" data-intro hidden></p>

          <form class="ev__form" data-form novalidate>
            <div class="ev__field" data-field="name">
              <label for="f-name">称呼 <span class="ev__tag" data-mark>选填</span></label>
              <input id="f-name" name="name" type="text" autocomplete="name" maxlength="40" aria-describedby="f-name-err">
              <p class="ev__err" id="f-name-err"></p>
            </div>
            <div class="ev__field" data-field="phone">
              <label for="f-phone">手机号 <span class="ev__tag ev__tag--req">必填</span></label>
              <input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" required aria-describedby="f-phone-err">
              <p class="ev__err" id="f-phone-err"></p>
            </div>
            <div class="ev__field" data-field="company">
              <label for="f-company">公司 / 档口 <span class="ev__tag" data-mark>选填</span></label>
              <input id="f-company" name="company" type="text" autocomplete="organization" maxlength="40" aria-describedby="f-company-err">
              <p class="ev__err" id="f-company-err"></p>
            </div>
            <div class="ev__field" data-field="project">
              <label for="f-project">项目 / 需求 <span class="ev__tag" data-mark>选填</span></label>
              <textarea id="f-project" name="project" rows="3" maxlength="200" aria-describedby="f-project-err" placeholder="比如：想找中东物流、想做 TikTok 直播"></textarea>
              <p class="ev__err" id="f-project-err"></p>
            </div>

            <div class="ev__consent">
              <label class="ev__check">
                <input type="checkbox" name="consent" aria-describedby="f-consent-err">
                <span>我同意义乌AI圈收集以上信息，仅用于本次活动报名和后续联系。详见<a href="/legal.html#privacy" target="_blank" rel="noopener">《隐私政策》</a></span>
              </label>
              <p class="ev__err" id="f-consent-err"></p>
            </div>

            <p class="ev__form-error" data-form-error role="alert"></p>
            <button class="ev__submit" type="submit" data-submit>提交报名</button>
          </form>

          <div class="ev__done" data-done tabindex="-1" hidden>
            <div class="ev__done-seal" aria-hidden="true">已报名</div>
            <h2 data-done-title>报名成功</h2>
            <p data-done-text>我们已经收到你的报名，活动前会和你联系。</p>
            <button class="ev__invite-btn" type="button" data-invite-open hidden>
              <span aria-hidden="true">✦</span> 查看我的专属邀请函
            </button>
            <div class="ev__done-acts">
              <button class="ev__ghost" type="button" data-share>分享给朋友</button>
              <button class="ev__ghost" type="button" data-edit>修改报名信息</button>
            </div>
          </div>

          <div class="ev__closed" data-closed hidden>
            <h2 data-closed-title>报名已结束</h2>
            <p data-closed-text>感谢关注，下次活动见。</p>
            <button class="ev__invite-btn" type="button" data-invite-open hidden>
              <span aria-hidden="true">✦</span> 查看我的专属邀请函
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="ev__missing" data-missing hidden>
    <img src="/assets/img/logo.png?v=2" alt="义乌AI圈">
    <h1>活动不存在或已下线</h1>
    <p>链接可能已经失效，可以去首页看看最新活动。</p>
    <a class="ev__ghost" href="/">去首页</a>
  </div>

</main>

<div class="inv" data-invite role="dialog" aria-modal="true" aria-labelledby="invTitle" hidden>
  <div class="inv__fx" data-invite-fx aria-hidden="true"></div>
  <div class="inv__panel">
    <p class="inv__kicker" aria-hidden="true">INVITATION</p>
    <h2 class="inv__title" id="invTitle" tabindex="-1" data-invite-title>您的专属邀请函</h2>
    <div class="inv__card" data-invite-card>
      <div class="inv__loading" data-invite-loading>
        <span class="inv__spinner" aria-hidden="true"></span>
        正在为您烫金…
      </div>
      <img class="inv__img" data-invite-img alt="" hidden>
    </div>
    <p class="inv__hint" data-invite-hint>长按图片保存，发给朋友或朋友圈</p>
    <div class="inv__acts">
      <button class="inv__save" type="button" data-invite-save disabled>保存邀请函</button>
      <button class="inv__close" type="button" data-invite-close>关闭</button>
    </div>
  </div>
</div>

<div class="ev__toast" data-toast role="status" aria-live="polite"></div>

<audio data-audio loop preload="none"></audio>
<script src="/assets/js/invite.js?v=3" defer></script>
<script src="/assets/js/event.js?v=2" defer></script>
</body>
</html>
